<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ODIN COFFEE">
  <title>ODIN COFFEE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; }
    body { min-width: 320px; }
    .page {
      position: relative;
      width: 100%;
      max-width: 1366px;
      margin: 0 auto;
      line-height: 0;
    }
    .page > img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      background: transparent;
      text-decoration: none;
      cursor: pointer;
      line-height: normal;
      -webkit-tap-highlight-color: transparent;
    }
    /* 최종 이미지의 Contact us 영역에 맞춘 투명 클릭 영역 */
    .instagram {
      left: 56.5%;
      top: 93.85%;
      width: 40.5%;
      height: 1.55%;
    }
    .store {
      left: 56.5%;
      top: 95.48%;
      width: 42.5%;
      height: 1.62%;
    }
    .hotspot:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="odin-webend.svg" alt="ODIN COFFEE 웹사이트">

    <a class="hotspot instagram"
       href="https://instagram.com/odincoffee_2025"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="ODIN COFFEE 인스타그램 열기"></a>

    <a class="hotspot store"
       href="https://smartstore.naver.com/odincoffee"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="ODIN COFFEE 스마트스토어 열기"></a>
  </main>
</body>
</html>
