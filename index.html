<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="오딘 커피 — 좋은 커피의 기준을 만듭니다." />
  <title>ODIN COFFEE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page" aria-label="ODIN COFFEE 공식 소개 페이지">
    <img
      class="page-artwork"
      src="odin-web.svg"
      alt="ODIN COFFEE 브랜드, 커피 공급 과정, 인증 및 연락처 안내"
      width="1024.5"
      height="4638"
    />

    <!-- 상단 빨간 버튼: 원본 레이아웃 위에 투명 링크만 배치 -->
    <a
      class="hotspot hotspot-instagram-button"
      href="https://www.instagram.com/odincoffee_2025/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ODIN COFFEE 인스타그램 새 창에서 열기"
      title="Instagram"
    ></a>

    <a
      class="hotspot hotspot-store-button"
      href="https://smartstore.naver.com/odincoffee"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ODIN COFFEE 온라인 스토어 새 창에서 열기"
      title="Online Store"
    ></a>

    <!-- 하단 연락처 영역의 주소도 클릭 가능하게 연결 -->
    <a
      class="hotspot hotspot-instagram-footer"
      href="https://www.instagram.com/odincoffee_2025/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="하단 인스타그램 주소 열기"
      title="Instagram"
    ></a>

    <a
      class="hotspot hotspot-store-footer"
      href="https://smartstore.naver.com/odincoffee"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="하단 네이버 스마트스토어 주소 열기"
      title="Online Store"
    ></a>
  </main>
</body>
</html>
