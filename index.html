<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="오딘 커피 공식 소개 페이지" />
  <title>ODIN COFFEE</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #312210; }
    body {
      min-width: 320px;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }
    .page {
      position: relative;
      width: min(100%, 1024.5px);
      margin: 0 auto;
      line-height: 0;
      overflow: hidden;
    }
    .artwork {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      image-rendering: auto;
      shape-rendering: geometricPrecision;
    }
    .hotspot {
      position: absolute;
      z-index: 10;
      display: block;
      border-radius: 0.65rem;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      line-height: normal;
      text-decoration: none;
    }
    .hotspot:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -5px;
    }
    /* 원본 SVG viewBox(1024.5 × 4638) 기준 좌표를 백분율로 변환한 클릭 영역 */
    .instagram {
      left: 14.35%;
      top: 30.57%;
      width: 35.72%;
      height: 1.94%;
    }
    .store {
      left: 54.17%;
      top: 30.57%;
      width: 35.72%;
      height: 1.94%;
    }
    @media (max-width: 480px) {
      .hotspot { border-radius: 0.45rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="오딘 커피 공식 웹사이트">
    <img
      class="artwork"
      src="odin-coffee.svg"
      alt="오딘 커피 브랜드 소개, 철학, 공급망 및 연락처 안내"
      width="1024.5"
      height="4638"
      decoding="async"
      fetchpriority="high"
    />

    <a
      class="hotspot instagram"
      href="https://www.instagram.com/odincoffee_2025/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="오딘 커피 인스타그램 새 창에서 열기"
      title="Instagram"
    ></a>

    <a
      class="hotspot store"
      href="https://smartstore.naver.com/odincoffee"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="오딘 커피 온라인 스토어 새 창에서 열기"
      title="Online Store"
    ></a>
  </main>
</body>
</html>
